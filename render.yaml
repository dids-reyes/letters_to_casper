services:
  - type: web
    name: letters-to-casper-sky
    runtime: node
    rootDir: sky-server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKY_ALLOWED_ORIGINS
        value: https://letterstocasper.com,https://www.letterstocasper.com
