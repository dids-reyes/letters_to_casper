<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your letter has been approved</title>
</head>

<body
  style="
    margin:0;
    padding:0;
    background:#eef3ff;
    font-family:Arial,Helvetica,sans-serif;
    color:#293142;
  "
>
  <table
    role="presentation"
    width="100%"
    cellspacing="0"
    cellpadding="0"
    border="0"
    style="width:100%;background:#eef3ff;padding:32px 12px;"
  >
    <tr>
      <td align="center">

        <table
          role="presentation"
          width="100%"
          cellspacing="0"
          cellpadding="0"
          border="0"
          style="
            width:100%;
            max-width:560px;
            background:#fffdf6;
            border:1px solid #e5dcc5;
            border-radius:18px;
            overflow:hidden;
          "
        >

          <!-- Top accent -->
          <tr>
            <td style="height:6px;background:#3772ff;font-size:0;line-height:0;">
              &nbsp;
            </td>
          </tr>

          <!-- Header -->
          <tr>
            <td
              align="center"
              style="padding:36px 34px 18px;text-align:center;"
            >

              <img
                src="https://letterstocasper.com/ltc-preview.webp"
                alt="Letters to Casper"
                width="280"
                style="
                  display:block;
                  width:100%;
                  max-width:280px;
                  height:auto;
                  margin:0 auto 24px;
                  border:0;
                  outline:none;
                  text-decoration:none;
                "
              />

              <h1
                style="
                  margin:0 0 10px;
                  font-family:Georgia,'Times New Roman',serif;
                  font-size:28px;
                  line-height:1.3;
                  font-weight:700;
                  color:#282923;
                "
              >
                Your letter is now open.
              </h1>

              <p
                style="
                  margin:0;
                  color:#74776f;
                  font-size:14px;
                  line-height:1.65;
                "
              >
                It passed review and has joined the Letters to Casper collection.
              </p>

            </td>
          </tr>

          <!-- Letter details -->
          <tr>
            <td style="padding:10px 34px 26px;">

              <table
                role="presentation"
                width="100%"
                cellspacing="0"
                cellpadding="0"
                border="0"
                style="
                  width:100%;
                  background:#fffaf0;
                  border:1px solid #e8dfca;
                  border-radius:13px;
                "
              >
                <tr>
                  <td
                    style="
                      padding:20px;
                      font-family:'Courier New',Courier,monospace;
                    "
                  >

                    <p
                      style="
                        margin:0 0 8px;
                        color:#9a8a69;
                        font-size:11px;
                        line-height:1.5;
                        text-transform:uppercase;
                        letter-spacing:.08em;
                      "
                    >
                      From
                      <strong
                        style="
                          color:#34342e;
                          text-transform:none;
                          font-size:13px;
                        "
                      >
                        Dids
                      </strong>
                    </p>

                    <p
                      style="
                        margin:0;
                        color:#9a8a69;
                        font-size:11px;
                        line-height:1.5;
                        text-transform:uppercase;
                        letter-spacing:.08em;
                      "
                    >
                      To
                      <strong
                        style="
                          color:#34342e;
                          text-transform:none;
                          font-size:13px;
                        "
                      >
                        Casper
                      </strong>
                    </p>

                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- CTA -->
          <tr>
            <td
              align="center"
              style="padding:0 34px 36px;text-align:center;"
            >

              <a
                href="https://letterstocasper.com/letters/sample"
                target="_blank"
                style="
                  display:inline-block;
                  padding:14px 26px;
                  background:#3772ff;
                  color:#ffffff;
                  font-size:14px;
                  line-height:1;
                  font-weight:700;
                  text-decoration:none;
                  border-radius:11px;
                "
              >
                Open your letter
              </a>

              <p
                style="
                  margin:18px 0 0;
                  color:#9b9d98;
                  font-size:11px;
                  line-height:1.6;
                "
              >
                You received this one-time notification because you requested it
                after submitting your letter.
              </p>

            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>
</body>
</html>
